services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brats"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:8.2.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data

  backend:
    build:
      context: ./backend
    ports:
      - 8000:8000
    env_file: "./backend/.env"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/brats
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      UPLOAD_STAGING_DIR: /app/upload-staging
      ORTHANC_URL: ${ORTHANC_URL:-http://orthanc:8042}
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-orthanc}
    #   AWS_S3_BUCKET: ${AWS_S3_BUCKET:-brats}
    #   AWS_REGION: ${AWS_REGION:-ru-central1}
    #   AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-https://storage.yandexcloud.net}
    #   AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    #   AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - upload_staging:/app/upload-staging
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      orthanc:
        condition: service_started

  segmentation-worker:
    build:
      context: ./backend
    command: ["/app/.venv/bin/python", "-m", "app.worker"]
    env_file: "./backend/.env"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/brats
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      UPLOAD_STAGING_DIR: /app/upload-staging
    volumes:
      - upload_staging:/app/upload-staging
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started


  orthanc:
    image: orthancteam/orthanc:24.5.1
    ports:
      - "8042:8042"
      - "4242:4242"
    environment:
      ORTHANC__NAME: Brats Orthanc
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: |
        {"orthanc":"orthanc"}
    volumes:
      - orthanc_data:/var/lib/orthanc/db

  frontend:
    build:
      context: ./frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend
  
  nginx:
    image: nginx:1.27-alpine
    container_name: brats-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  kafka_data:
  upload_staging:
  orthanc_data:
