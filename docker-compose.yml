services:
  postgres:
    image: postgres:16-alpine
    container_name: brats-postgres
    environment:
      POSTGRES_DB: brats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brats"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: brats-backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/brats
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-brats}
      AWS_REGION: ${AWS_REGION:-ru-central1}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-https://storage.yandexcloud.net}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: brats-frontend
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: brats-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
